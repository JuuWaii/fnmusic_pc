name: Windows release

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -and $env:GITHUB_REF_NAME -notin @($tag, "release/$tag")) { throw 'Release ref does not match package version' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag is missing' }
          git checkout --detach $tag
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check out release tag' }
      - run: npm ci
      - run: npm test
      - run: npm run check:privacy
      - name: Build Windows installer and portable app
        run: npm run dist -- --publish never
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $assets = @("dist/FNMusicPC Setup $version.exe", "dist/FNMusicPC $version.exe")
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $asset)"
          }
          $checksums | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
          gh release create $env:RELEASE_TAG @assets dist/SHA256SUMS.txt --verify-tag --title "FN Music PC $env:RELEASE_TAG" --notes-file "docs/releases/$env:RELEASE_TAG.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
