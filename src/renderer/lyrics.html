<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';" />
<title>桌面歌词</title>
<link rel="stylesheet" href="lyrics.css" />
</head>
<body>
  <!-- 顶部拖动条 -->
  <div id="dragbar" class="dragbar">
    <span class="drag-handle" title="拖动歌词窗口">&#9776;</span>
    <span id="trackName" class="track">未在播放</span>
    <button id="btnInteractive" class="mini" title="点击穿透开关">&#128065;</button>
    <button id="btnClose" class="mini" title="关闭桌面歌词">&#10005;</button>
  </div>
  <!-- 歌词主体 -->
  <div id="lyricBody" class="body">
    <div id="curLine" class="line cur">…</div>
    <div id="nextLine" class="line next"></div>
  </div>
  <script src="lyrics.js"></script>
</body>
</html>
